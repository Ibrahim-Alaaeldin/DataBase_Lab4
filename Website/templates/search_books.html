
{% extends "base.html" %}

{% block content %}
<h2>Search Books</h2>

<form method="POST">
    <label>Title Keyword:</label>
    <input type="text" name="title" value="{{ title }}">

    <label>Minimum Price:</label>
    <input type="number" step="0.01" name="min_price" value="{{ min_price }}">

    <label>Maximum Price:</label>
    <input type="number" step="0.01" name="max_price" value="{{ max_price }}">

    <label>Categories:</label>
    <select name="category_id" multiple>
        {% for category in categories %}
            <option value="{{ category.category_id }}"
                {% if category.category_id|string in selected_categories %}selected{% endif %}>
                {{ category.name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Search</button>
</form>

<hr>

<h3>Search Results</h3>

{% if books %}
<table>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Price</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.category }}</td>
        <td>{{ book.price }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No books found.</p>
{% endif %}

{% endblock %}
